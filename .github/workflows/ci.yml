name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Python for visual review tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test visual review tools
        run: |
          python -m pip install -r tools/requirements-visual-review.txt
          python -m unittest discover -s tools
